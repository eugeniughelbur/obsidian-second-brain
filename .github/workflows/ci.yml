name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pytest ruff -r requirements.txt
      - name: Lint Python
        run: ruff check .
      - name: Run tests
        run: pytest -q
      # Fail the build if a banned substitution character (em-dash, curly quote,
      # Unicode math) appears in prose in a tracked source file.
      - name: Lint substitution characters
        run: python scripts/sweep_non_ascii.py --check
