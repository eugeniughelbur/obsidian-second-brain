# hermes-hooks.config.example.yaml
#
# Paste-in template for the `hooks:` block of your ~/.hermes/config.yaml.
# Registers the vault maintenance hook on the on_session_finalize lifecycle event -
# the Hermes analog of the Claude PostCompact hook. Not on_session_end: Hermes
# fires that after every turn, and the hook's own `hermes -z` run fires it again.
#
# OPT-IN / SHIPS INERT. Registering the hook is not enough: the script no-ops
# unless BOTH OBSIDIAN_VAULT_PATH and OBSIDIAN_HERMES_HOOK_ENABLED=1 are in the
# environment (it writes to the vault unattended). Set them in ~/.hermes/.env, and
# run `hermes --accept-hooks -z "reply OK"` once to consent to the hook. See the
# script header for the trust caveat. To disable later, clear
# OBSIDIAN_HERMES_HOOK_ENABLED.
#
# At most one consolidation per OBSIDIAN_HERMES_MIN_INTERVAL seconds (default
# 21600, 6 hours; 0 turns the interval off), counted from the start of the last.
#
# session lifecycle events take no matcher (matchers apply only to
# pre_tool_call / post_tool_call). The script receives the on_session_finalize JSON
# payload on stdin and must print JSON on stdout; this one prints `{}`.

hooks:
  on_session_finalize:
    - command: "~/.hermes/agent-hooks/obsidian-hermes-session-end.sh"
      timeout: 30
