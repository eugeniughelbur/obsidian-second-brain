[project]
name = "obsidian-second-brain"
version = "1.0.0"
description = "LLM Wiki skills for Claude Code and Codex: init, save, find, health, review over an Obsidian vault"
requires-python = ">=3.10"
authors = [{ name = "Eugeniu Ghelbur" }]
# Runtime deps for the toolkit venv. requirements.txt mirrors this list for the
# installer, which builds the venv with plain pip.
dependencies = [
    "pyyaml>=6,<7",
    "youtube-transcript-api>=1.2,<2",
    "tomli>=2; python_version < \"3.11\"",
]

[project.urls]
Upstream = "https://github.com/eugeniughelbur/obsidian-second-brain"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

# CI gates this exact set: F (pyflakes), I (import sorting), PTH (pathlib).
# Deliberately not gated: E501 line length (formatting convention only) and
# E402 (the sys.path shim the scripts use to import siblings requires it).
[tool.ruff.lint]
select = ["F", "I", "PTH"]
