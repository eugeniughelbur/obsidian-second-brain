[project]
name = "obsidian-second-brain-research"
version = "0.14.0"
description = "Research toolkit for obsidian-second-brain - Grok, Perplexity, Gemini, and YouTube research that saves to your vault"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
    "youtube-transcript-api>=0.6.2",
    "google-api-python-client>=2.110.0",
    "google-genai>=2.3.0",
    "feedparser>=6.0.10",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

# CI gates this exact set and nothing more, so the claim in CLAUDE.md matches
# reality. "F" is pyflakes: undefined names, unused imports, f-strings with no
# placeholders - the rules that catch bugs rather than opinions.
#
# Deliberately NOT gated:
#   E501  line length. 203 existing violations; line-length above stays the
#         formatting convention, not a build-breaking rule.
#   E402  module-level import not at top. The sys.path shim these scripts use
#         to import siblings requires it.
#   E731  lambda assignment. Used intentionally in research/lib/config.py.
# Widening this list means fixing the backlog first, not adding a noqa sweep.
[tool.ruff.lint]
select = ["F", "I", "PTH"]


